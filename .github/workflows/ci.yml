name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  LEOCARD_BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }}

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            mold \
            pkg-config

      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo test output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-test-${{ env.LEOCARD_BUILD_PROFILE }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Linux-cargo-test-${{ env.LEOCARD_BUILD_PROFILE }}-

      - name: Install Clippy for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: rustup component add clippy

      - name: Lint workspace
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo clippy --workspace --all-targets --all-features --profile ${{ env.LEOCARD_BUILD_PROFILE }} --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --profile ${{ env.LEOCARD_BUILD_PROFILE }} --locked -- --test-threads=1

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: leocard-linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            artifact: leocard-windows-x86_64.exe
          - name: macOS Apple Silicon
            os: macos-latest
            artifact: leocard-macos-arm64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            mold \
            pkg-config

      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Configure macOS builds
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.LEOCARD_BUILD_PROFILE }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.LEOCARD_BUILD_PROFILE }}-

      - name: Build debug client
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo build -p leocard-client --all-features --locked

      - name: Build self-contained release client
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build -p leocard-client --release --locked

      - name: Package Linux binary and checksum
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          install -Dm755 target/release/leocard "dist/${{ matrix.artifact }}"
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Package Windows binary and checksum
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/leocard.exe "dist/${{ matrix.artifact }}"
          $hash = (Get-FileHash "dist/${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content -Encoding ascii "dist/${{ matrix.artifact }}.sha256"

      - name: Package macOS app and checksum
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/package-macos.sh target/release/leocard "${{ matrix.artifact }}"

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEOCARD_ROOT: ${{ github.workspace }}
      CARGO_BUILD_JOBS: "2"
      LEOCARD_BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'android-dev' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang mold pkg-config

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Select current stable Rust and Android target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Clippy for Android release
        if: startsWith(github.ref, 'refs/tags/v')
        run: rustup component add clippy

      - name: Cache Android build dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target/aarch64-linux-android
            target/release
            target/android-dev
            target/android/gradle-home/caches
            target/android/gradle-9.8.1
          key: Android-arm64-${{ env.LEOCARD_BUILD_PROFILE }}-${{ hashFiles('**/Cargo.lock', 'crates/client/android/**/*.gradle', 'crates/client/android/gradle.properties', 'crates/client/android/toolchain.sh') }}
          restore-keys: |
            Android-arm64-${{ env.LEOCARD_BUILD_PROFILE }}-

      - name: Prepare Android SDK, NDK and Gradle
        run: |
          source crates/client/android/toolchain.sh
          android_sdk
          (set +o pipefail; yes | sdkmanager --licenses > /dev/null)
          android_tools

      - name: Lint ARM64 release native library
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source crates/client/android/toolchain.sh
          cargo ndk -t arm64-v8a -P 31 clippy -p leocard-android --lib --release --all-features --locked -- -D warnings

      - name: Build ARM64 debug native library
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          source crates/client/android/toolchain.sh
          cargo ndk -t arm64-v8a -P 31 -o target/android/jniLibs build -p leocard-android --lib --features developer --profile android-dev --locked

      - name: Build ARM64 release native library
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source crates/client/android/toolchain.sh
          cargo ndk -t arm64-v8a -P 31 -o target/android/jniLibs build -p leocard-android --lib --release --locked

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          source crates/client/android/toolchain.sh
          "$LEOCARD_GRADLE" -p crates/client/android --no-daemon -PleocardAbi=arm64-v8a :app:assembleDebug

      - name: Build and verify signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release signing secret: $name" >&2
              exit 1
            fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/leocard-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          source crates/client/android/toolchain.sh
          "$LEOCARD_GRADLE" -p crates/client/android --no-daemon -PleocardAbi=arm64-v8a :app:assembleRelease
          apk=crates/client/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          mkdir -p dist
          cp "$apk" dist/leocard-android-arm64.apk
          (cd dist; sha256sum leocard-android-arm64.apk > leocard-android-arm64.apk.sha256)

      - name: Upload Android release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: leocard-android-arm64.apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify tag matches the client version
        shell: bash
        run: |
          package_id="$(cargo pkgid -p leocard-client)"
          package_version="${package_id##*@}"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match leocard-client ${package_version}." >&2
            exit 1
          fi

      - name: Download platform release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: leocard-*
          path: release
          merge-multiple: true

      - name: Verify release assets and checksums
        shell: bash
        run: |
          cd release
          for asset in \
            leocard-linux-x86_64 \
            leocard-windows-x86_64.exe \
            leocard-macos-arm64.zip \
            leocard-android-arm64.apk; do
            test -s "$asset"
            sha256sum --check "$asset.sha256"
          done

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --verify-tag \
              --generate-notes \
              --title "LeoCard ${GITHUB_REF_NAME}"
          fi
