name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            mold \
            pkg-config

      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Cache Cargo test output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Linux-cargo-test-

      - name: Lint workspace
        # Older tags may predate the strict Clippy gate; keep their original test gate.
        if: inputs.release_tag == ''
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked -- --test-threads=1

  build:
    name: Build ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: leocard-linux-x86_64
          - name: Windows x86_64
            os: windows-2022
            artifact: leocard-windows-x86_64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            mold \
            pkg-config

      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo dependencies and release output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build self-contained client
        run: cargo build -p leocard-client --release --locked

      - name: Package Linux binary and checksum
        if: runner.os == 'Linux'
        run: |
          install -Dm755 target/release/leocard "dist/${{ matrix.artifact }}"
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Package Windows binary and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/leocard.exe "dist/${{ matrix.artifact }}"
          $hash = (Get-FileHash "dist/${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content -Encoding ascii "dist/${{ matrix.artifact }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify tag matches the client version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          package_id="$(cargo pkgid -p leocard-client)"
          package_version="${package_id##*@}"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match leocard-client ${package_version}." >&2
            exit 1
          fi

      - name: Download Linux and Windows artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: leocard-*
          path: release
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --verify-tag \
              --generate-notes \
              --title "LeoCard ${RELEASE_TAG}"
          fi
