[workspace]
members = [
    "crates/client/*",
    "crates/games/*",
    "crates/host",
    "crates/network/*",
]
# Keep the Android cdylib out of default desktop builds.
default-members = [
    "crates/client/app",
    "crates/client/assets",
    "crates/client/ui",
    "crates/client/update",
    "crates/games/*",
    "crates/host",
    "crates/network/*",
]
resolver = "3"

[workspace.package]
version = "0.10.1"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99.1"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_audio",
    "bevy_log",
    "bevy_scene",
    "bevy_state",
    "bevy_winit",
    "default_font",
    "mp3",
    "multi_threaded",
    "png",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "ui_picking",
    "vorbis",
    "wayland",
    "x11",
] }
bevy_clipboard = { version = "0.20", default-features = false }
csv = "1.4"
ed25519-dalek = "3.0"
fastrand = "2.5"
getrandom = "0.4"
# Route ICU diagnostics through Bevy's logger instead of debug-only stderr output.
icu_provider = { version = "2.3", default-features = false, features = [
    "logging",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
jni = { version = "0.22.4", default-features = false }
md-5 = "0.11"
postcard = { version = "1.1", features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "rustls",
] }
rfd = "0.17"
rustls-platform-verifier = "0.7"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
socket2 = "0.6"
sysinfo = { version = "0.39", default-features = false }
tokio = { version = "1.53", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
winit = { version = "0.30", default-features = false }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = 0

# Cross-platform debug builds keep native compilation small enough for local emulators.
[profile.android-dev]
inherits = "dev"
debug = "line-tables-only"

[profile.android-dev.package."*"]
opt-level = 3
