[workspace]
members = ["crates/client", "crates/games/mahjong", "crates/games/qigui523", "crates/games/shengji", "crates/games/texas-holdem", "crates/games/uno", "crates/host", "crates/protocol", "crates/tcp"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.98"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_audio", "bevy_log", "bevy_state", "bevy_winit", "default_font", "mp3", "multi_threaded", "png", "ui_api", "ui_bevy_render", "vorbis", "wayland", "x11"] }
bevy_clipboard = { version = "0.19", features = ["system_clipboard"] }
ed25519-dalek = "3.0"
fastrand = "2.5"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
postcard = { version = "1.1", features = ["alloc"] }
rfd = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
