[package]
name = "leocard-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bevy client and transport-neutral client state for LeoCard"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "leocard"
path = "src/main.rs"

[features]
default = []
developer = ["leocard-qigui523/developer", "leocard-host/developer"]
# Debug builds keep loading the workspace `assets` directory by default. This
# feature enables the single-binary asset source explicitly; release builds
# enable the same behavior automatically from build.rs.
embedded-assets = []

[dependencies]
leocard-achievements = { path = "../achievements" }
bevy.workspace = true
bevy_clipboard.workspace = true
icu_provider.workspace = true
ed25519-dalek.workspace = true
leocard-qigui523 = { path = "../games/qigui523" }
leocard-mahjong = { path = "../games/mahjong" }
leocard-shengji = { path = "../games/shengji" }
leocard-texas-holdem = { path = "../games/texas-holdem" }
leocard-uno = { path = "../games/uno" }
leocard-host = { path = "../host" }
leocard-protocol = { path = "../protocol" }
leocard-tcp = { path = "../tcp" }
fastrand.workspace = true
getrandom.workspace = true
image.workspace = true
postcard.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
winit.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd.workspace = true
bevy_clipboard = { workspace = true, features = ["system_clipboard"] }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }
jni = "0.21.1"

[build-dependencies]
winresource = "0.1"
