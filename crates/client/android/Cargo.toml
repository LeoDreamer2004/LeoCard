[package]
name = "leocard-android"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
developer = ["leocard-client/developer"]

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }
jni.workspace = true
leocard-client = { path = "../app" }
