[package]
name = "leocard-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bevy client and transport-neutral client state for LeoCard"

[[bin]]
name = "leocard"
path = "src/main.rs"

[features]
default = []
developer = [
    "leocard-qigui523/developer",
    "leocard_mc_guess/developer",
    "leocard-host/developer",
]
# Debug builds keep loading the workspace `assets` directory by default. This
# feature enables the single-binary asset source explicitly; release builds
# enable the same behavior automatically in leocard-assets.
embedded-assets = ["leocard-assets/embedded-assets"]

[dependencies]
bevy.workspace = true
bevy_clipboard.workspace = true
ed25519-dalek.workspace = true
fastrand.workspace = true
getrandom.workspace = true
icu_provider.workspace = true
image.workspace = true
leocard-achievements = { path = "../../games/achievements" }
leocard-assets = { path = "../assets" }
leocard-blackjack = { path = "../../games/blackjack" }
leocard-doudizhu = { path = "../../games/doudizhu", features = ["serde"] }
leocard-game-common = { path = "../../games/common" }
leocard-host = { path = "../../host" }
leocard-mahjong = { path = "../../games/mahjong" }
leocard_mc_guess = { path = "../../games/mc-guess" }
leocard-protocol = { path = "../../network/protocol" }
leocard-qigui523 = { path = "../../games/qigui523" }
leocard-shengji = { path = "../../games/shengji" }
leocard-tcp = { path = "../../network/tcp" }
leocard-texas-holdem = { path = "../../games/texas-holdem" }
leocard-ui = { path = "../ui" }
leocard-uno = { path = "../../games/uno" }
leocard-update = { path = "../update" }
postcard.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
winit.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { workspace = true, features = ["custom_cursor"] }
bevy_clipboard = { workspace = true, features = ["system_clipboard"] }
leocard-sakura-frp = { path = "../../network/sakura-frp" }
rfd.workspace = true
sysinfo = { workspace = true, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification.workspace = true
winreg.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }
jni.workspace = true
rustls-platform-verifier.workspace = true

[build-dependencies]
winresource.workspace = true
